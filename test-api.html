<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Places API Test</title>
</head>
<body>
    <h1>Google Places API Test</h1>
    <button onclick="testAPI()">Test API</button>
    <div id="results"></div>

    <script>
        async function testAPI() {
            const apiKey = 'AIzaSyA4vDnagg1GLN1aNHs6UIx7H5nXm1uR4gM';
            const placeId = 'ChIJa9YfcKmRyzsRHOEe5zg4VGo';
            
            console.log('Testing Google Places API...');
            console.log('API Key:', apiKey);
            console.log('Place ID:', placeId);
            
            // Test 1: Basic place details
            const basicUrl = `https://maps.googleapis.com/maps/api/place/details/json?place_id=${placeId}&key=${apiKey}`;
            console.log('Basic URL:', basicUrl);
            
            // Test 2: Place details with reviews field
            const reviewsUrl = `https://maps.googleapis.com/maps/api/place/details/json?place_id=${placeId}&fields=name,reviews,rating&key=${apiKey}`;
            console.log('Reviews URL:', reviewsUrl);
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Testing API...</p>';
            
            try {
                console.log('Attempting direct API call...');
                const response = await fetch(reviewsUrl);
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('API Response:', data);
                
                resultsDiv.innerHTML = `
                    <h3>API Response:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
            } catch (error) {
                console.error('API Error:', error);
                resultsDiv.innerHTML = `
                    <h3>Error:</h3>
                    <p style="color: red;">${error.message}</p>
                    <p>This is expected due to CORS policy. The API key and Place ID need to be tested from backend or using JSONP.</p>
                `;
                
                // Try alternative approach - test if we can at least construct valid URLs
                testURLConstruction();
            }
        }
        
        function testURLConstruction() {
            const apiKey = 'AIzaSyA4vDnagg1GLN1aNHs6UIx7H5nXm1uR4gM';
            const placeId = 'ChIJa9YfcKmRyzsRHOEe5zg4VGo';
            
            console.log('=== URL Construction Test ===');
            
            // Test different field combinations
            const urls = [
                `https://maps.googleapis.com/maps/api/place/details/json?place_id=${placeId}&fields=name&key=${apiKey}`,
                `https://maps.googleapis.com/maps/api/place/details/json?place_id=${placeId}&fields=name,rating&key=${apiKey}`,
                `https://maps.googleapis.com/maps/api/place/details/json?place_id=${placeId}&fields=name,reviews&key=${apiKey}`,
                `https://maps.googleapis.com/maps/api/place/details/json?place_id=${placeId}&fields=reviews&key=${apiKey}`
            ];
            
            urls.forEach((url, index) => {
                console.log(`URL ${index + 1}:`, url);
            });
            
            // Test Place ID format
            console.log('=== Place ID Validation ===');
            console.log('Place ID format valid:', placeId.startsWith('ChIJ'));
            console.log('Place ID length:', placeId.length);
            
            // Test API Key format
            console.log('=== API Key Validation ===');
            console.log('API Key format valid:', apiKey.startsWith('AIza'));
            console.log('API Key length:', apiKey.length);
            
            document.getElementById('results').innerHTML += `
                <h3>URL Construction Test:</h3>
                <p>✅ Place ID format: ${placeId.startsWith('ChIJ') ? 'Valid' : 'Invalid'}</p>
                <p>✅ API Key format: ${apiKey.startsWith('AIza') ? 'Valid' : 'Invalid'}</p>
                <p>✅ URLs constructed successfully</p>
                <p><strong>Note:</strong> Direct frontend calls will fail due to CORS. Need backend proxy.</p>
            `;
        }
    </script>
</body>
</html>
